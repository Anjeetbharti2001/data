<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resister Form</title>
    <link rel="stylesheet" href="data1.css">
</head>
<body>
     <div class="f-container">
        <form>
            <h2>Student Registration Form</h2>
            <label for="name">First Name:</label>
            <input type="First name" id="name" value=" first name"> 
            <br><br>

            <label for="name">Last Name:</label>
            <input type="last name" id="name" value="last name">

            <br><br>
            <label for="name">Email Id:</label>
            <input type="Email Id" id="name" value="Email Id">
            <br><br>
            
            <label for="name">Password:</label>
            <input type="password" id="name" value="Password">
            <br><br>

            <label for="name">Re-Type Password:</label>
            <input type="repassword" id="name" value="Re-types password">
            <br><br>

            <label for="name">Gender:</label>
            <select id="gender" id="name" value="Gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <button type="submit">Submit</button>
        </form>
     </div>
</body>
</html>
